<!-- Component: Fixed App Header (section icon/title + account avatar) -->
<header class="app-header" id="app-header">
    <div class="app-header-brand">
        <svg class="app-header-crest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 20h20l-1.5-8-5 3.5-3.5-7-3.5 7-5-3.5L2 20z"></path>
            <circle cx="2" cy="10" r="1.4" fill="currentColor" stroke="none"></circle>
            <circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"></circle>
            <circle cx="22" cy="10" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
        <span class="app-header-brand-text">Companion</span>
    </div>
    <span class="app-header-title" id="header-section-title">Randomizer</span>
    <button
        type="button"
        class="app-header-avatar"
        id="header-avatar-btn"
        aria-label="Account">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </button>
</header>
