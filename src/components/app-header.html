<!-- Component: Fixed App Header (section icon/title + account avatar) -->
<header class="app-header" id="app-header">
    <span class="app-header-brand">Companion</span>
    <div class="app-header-title-group">
        <span class="app-header-icon" id="header-section-icon">🎲</span>
        <span class="app-header-title" id="header-section-title">Randomizer</span>
    </div>
    <button
        type="button"
        class="app-header-avatar"
        id="header-avatar-btn"
        aria-label="Account">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
    </button>
</header>
